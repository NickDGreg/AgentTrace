{% extends "public_base.html" %}
{% set form = form or {} %}

{% block auth_content %}
<div class="auth-panel">
  <div class="auth-logo">MA</div>
  <h2>Create account</h2>
  <p class="auth-sub">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>

  {% if error %}
    <div class="form-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('register') }}" class="auth-form" id="register-form">
    <label>First Name</label>
    <input type="text" name="display_name" required value="{{ form.get('display_name', '') }}">

    <label>Email</label>
    <input type="email" name="email" required value="{{ form.get('email', '') }}">

    <label>Country</label>
    <input type="text" name="country" required value="{{ form.get('country', '') }}">

    <label>Phone</label>
    <input type="text" name="phone" required value="{{ form.get('phone', '') }}">

    <label>Password</label>
    <input type="password" name="password" id="password" required>

    <label>Confirm Password</label>
    <input type="password" name="password_confirm" id="password_confirm" required>

    <div id="password-match-message" class="form-hint"></div>

    <button class="btn-primary wide" type="submit">Create account</button>
  </form>
</div>
{% endblock %}
