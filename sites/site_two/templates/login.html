{% extends "public_base.html" %}

{% block auth_content %}
<div class="auth-panel">
  <div class="auth-logo">MA</div>
  <h2>Log into your account</h2>
  <p class="auth-sub">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>

  {% if registered %}
    <div class="form-ok">Registration complete. Sign in with your new credentials.</div>
  {% endif %}
  {% if error %}
    <div class="form-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('login') }}" class="auth-form">
    <label>Account</label>
    <input type="text" name="account" placeholder="Username or email" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Password" required>

    <div class="auth-row">
      <label class="remember">
        <input type="checkbox" name="remember">
        <span>Remember me</span>
      </label>
      <span class="muted-link">Forgot password?</span>
    </div>

    <button class="btn-primary wide" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
