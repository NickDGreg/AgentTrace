{% extends "base.html" %}

{% block content %}
<section class="generic-panel withdraw-panel">
  <h1>Withdrawal</h1>
  <p>Submit on-chain withdrawals from your spot account.</p>

  <form class="withdraw-form" action="#" method="post" onsubmit="return false;">
    <label>Asset
      <select>
        <option>USDT</option>
        <option>BTC</option>
        <option>ETH</option>
      </select>
    </label>
    <label>Transfer Network
      <select>
        <option>TRC20</option>
        <option>ERC20</option>
        <option>BTC</option>
      </select>
    </label>
    <label>Withdrawal Address
      <input type="text" placeholder="Enter withdrawal address">
    </label>
    <label>Amount
      <input type="number" placeholder="0.00" min="0" step="0.0001">
    </label>
    <button type="submit">Submit Withdrawal</button>
  </form>

  <p class="inline-note">Security verification and withdrawal limits apply to all requests.</p>
</section>
{% endblock %}
