<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  </head>
  <body class="marketing-body">
    <header class="marketing-header">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-main">TITAN TRADE</span>
        <span class="brand-sub">GLOBAL LTD</span>
      </a>

      <nav class="marketing-nav">
        {% for item in menu_items %}
          <a href="{{ url_for(item.endpoint) }}">{{ item.label }}</a>
        {% endfor %}
      </nav>

      <div class="marketing-auth">
        <span class="flag" aria-hidden="true">🇬🇧</span>
        <a class="btn-outline" href="{{ url_for('login') }}">Log in</a>
        <a class="btn-solid" href="{{ url_for('register') }}">Register</a>
      </div>
    </header>

    {% block marketing_content %}{% endblock %}
  </body>
</html>
